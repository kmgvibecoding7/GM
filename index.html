<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>QuantDrill — тренажёр формул GMAT</title>
<meta name="description" content="Тренажёр математических формул GMAT Quant: интервальные повторения, 4 режима, XP, streak и рейтинг.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#161a2e;--mut:#667089;--line:#e3e6f0;--acc:#4f46e5;--acc-ink:#fff;--acc2:#0d9488;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--shadow:0 1px 2px rgba(20,24,50,.06),0 8px 24px rgba(20,24,50,.06);--r:16px}
:root[data-theme=dark]{--bg:#0e1120;--card:#181c32;--ink:#eceefb;--mut:#9aa3c4;--line:#2a2f4d;--acc:#8b86ff;--acc-ink:#0e1120;--acc2:#2dd4bf;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1618;--warn:#fbbf24;--warnbg:#3a2c0e;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:72px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}h1{font-size:clamp(1.8rem,5vw,3rem)}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:0 0 1em}a{color:var(--acc)}button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-style:normal;font-size:1.05rem}
nav.main{display:flex;gap:2px;margin-left:12px}
nav.main a{padding:8px 11px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.93rem}
nav.main a:hover{background:var(--line)}nav.main a.on{background:var(--acc);color:var(--acc-ink)}
.sp{flex:1}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.88rem;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem}
nav.tabs{display:none}
@media(max-width:820px){nav.main{display:none}nav.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:.7rem;font-weight:700;padding:6px 2px;min-height:48px;border-radius:10px}nav.tabs a b{display:block;font-size:1.25rem;line-height:1.2}nav.tabs a.on{color:var(--acc)}}
@media(max-width:520px){.bar{gap:8px}.logo span{display:none}.chip{padding:4px 8px;font-size:.8rem}}
main{padding:24px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.mut{color:var(--mut)}.sm{font-size:.88rem}.b{font-weight:700}.c{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}.btn.big{min-height:54px;padding:0 28px;font-size:1.05rem}.btn.ghost{background:transparent}.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--line);color:var(--mut)}.tag.leg{background:var(--warnbg);color:var(--warn)}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.bar-bg{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar-bg>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .4s}
.hero{padding:40px 0 24px;display:grid;gap:32px;grid-template-columns:1.15fr .85fr;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1.15rem;color:var(--mut);max-width:560px}
.float-card{transform:rotate(2deg)}
.tex{font-size:1.1em}.bigtex .katex{font-size:1.7em}
.feat{display:flex;gap:12px}.feat .em{font-size:1.6rem}
.topic{cursor:pointer;display:block;text-decoration:none;color:inherit;transition:transform .15s}.topic:hover{transform:translateY(-3px)}
.topic .em{font-size:1.8rem}
.flist a{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}.flist a:last-child{border:0}.flist a:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}.dot.m{background:var(--ok)}.dot.l{background:var(--warn)}.dot.b{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.92rem;min-height:40px}.pick.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.mode{padding:16px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left;display:block;width:100%}.mode.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}.mode .em{font-size:1.5rem}
label.f{display:block;font-weight:700;margin:14px 0 6px;font-size:.92rem}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);min-height:44px}
textarea{resize:vertical;min-height:80px}
.train{max-width:700px;margin:0 auto}
.tr-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.tr-top .bar-bg{flex:1}
.q{padding:28px 22px;min-height:260px}
.flip{cursor:pointer;user-select:none;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:280px;touch-action:pan-y}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:13px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:54px;font-size:1rem;width:100%}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt kbd{flex:none;width:26px;height:26px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rates button{min-height:54px;border-radius:12px;border:0;font-weight:800;cursor:pointer;color:#fff;font-size:.9rem}.r1{background:#dc2626}.r2{background:#d97706}.r3{background:#16a34a}.r4{background:#0d9488}
.fb{margin-top:16px;padding:14px 16px;border-radius:13px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}.fb .in{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums}.qt{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:10px}.qt i{display:block;height:100%;background:var(--warn);transition:width .25s linear}
.ring{position:relative;width:120px;height:120px;flex:none}.ring svg{transform:rotate(-90deg)}.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.1}
.stat{text-align:center}.stat .n{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}.stat .l{color:var(--mut);font-size:.85rem}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}.hm i{width:14px;height:14px;border-radius:3px;background:var(--line)}.hm i.l1{background:color-mix(in srgb,var(--acc) 30%,var(--line))}.hm i.l2{background:color-mix(in srgb,var(--acc) 55%,var(--line))}.hm i.l3{background:color-mix(in srgb,var(--acc) 80%,var(--line))}.hm i.l4{background:var(--acc)}
.hrow{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:.9rem}
@media(max-width:520px){.hrow{grid-template-columns:96px 1fr 40px}}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}th{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}tr.me td{background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:700}
.ach{text-align:center}.ach .em{font-size:2.2rem}.ach.lock{opacity:.45;filter:grayscale(1)}
.toast-box{position:fixed;top:72px;right:16px;z-index:100;display:grid;gap:8px;max-width:340px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}.seg button{border:0;background:var(--card);padding:8px 16px;cursor:pointer;font-weight:700;min-height:40px}.seg button.on{background:var(--acc);color:var(--acc-ink)}
.notice{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:12px;font-size:.88rem;font-weight:600}
.vars{color:var(--mut);font-size:.92rem}
details summary{cursor:pointer;font-weight:700}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:24px 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar" id="bar"></div></header>
<main class="wrap" id="app"></main>
<footer>QuantDrill · демо-версия MVP · данные хранятся только в вашем браузере</footer>
<nav class="tabs" id="tabs"></nav>
<div class="toast-box" id="toasts" aria-live="polite"></div>

<script>
'use strict';
const R = String.raw;
/* ============================ ДАННЫЕ ============================ */
const AVATARS = ['🦊','🐼','🦉','🐯','🐙','🦄','🐧','🦁'];
const TOPICS = [
 {id:1,ru:'Арифметика',en:'Arithmetic',em:'🔢'},
 {id:2,ru:'Проценты',en:'Percents',em:'％'},
 {id:3,ru:'Отношения и пропорции',en:'Ratios & Proportions',em:'⚖️'},
 {id:4,ru:'Степени и корни',en:'Exponents & Roots',em:'√'},
 {id:5,ru:'Алгебра',en:'Algebra',em:'𝑥'},
 {id:6,ru:'Неравенства и модули',en:'Inequalities & Absolute Value',em:'∣x∣'},
 {id:7,ru:'Текстовые задачи',en:'Word Problems',em:'🚆'},
 {id:8,ru:'Простой и сложный процент',en:'Simple & Compound Interest',em:'💰'},
 {id:9,ru:'Последовательности',en:'Sequences',em:'📈'},
 {id:10,ru:'Комбинаторика',en:'Combinatorics',em:'🎲'},
 {id:11,ru:'Вероятность',en:'Probability',em:'🎯'},
 {id:12,ru:'Статистика',en:'Statistics',em:'📊'},
 {id:13,ru:'Множества',en:'Sets',em:'⭕'},
 {id:14,ru:'Свойства чисел',en:'Number Properties',em:'🧮'},
 {id:15,ru:'Геометрия',en:'Geometry',em:'📐',legacy:true}
];
let _id=0;
function F(t,ru,en,tex,desc,w,ex,diff,d,ans,extra){return Object.assign({id:'f'+(++_id),t,ru,en,tex,desc,w,ex,diff,d,ans:ans||null},extra||{})}
const BASE = [
 F(1,'НОД и НОК','GCD × LCM',R`\gcd(a,b)\cdot\operatorname{lcm}(a,b)=a\cdot b`,'Связывает наибольший общий делитель и наименьшее общее кратное двух натуральных чисел. Помогает быстро найти НОК, если известен НОД.','a, b — натуральные числа','a=12, b=18: НОД=6, НОК=36, и 6·36=216=12·18.',1,[R`\gcd(a,b)+\operatorname{lcm}(a,b)=a+b`,R`\gcd(a,b)\cdot\operatorname{lcm}(a,b)=a+b`,R`\frac{\operatorname{lcm}(a,b)}{\gcd(a,b)}=a\cdot b`]),
 F(1,'Количество кратных','Multiples count',R`\left\lfloor \frac{N}{k}\right\rfloor`,'Сколько целых чисел от 1 до N делятся на k.','N — верхняя граница, k — делитель, ⌊ ⌋ — округление вниз','Сколько чисел от 1 до 100 кратны 7? ⌊100/7⌋ = 14.',1,[R`\left\lceil \frac{N}{k}\right\rceil`,R`\frac{N}{k}+1`,R`N-k`]),
 F(1,'Сумма первых n натуральных чисел','Sum of first n integers',R`S=\frac{n(n+1)}{2}`,'Сумма 1+2+…+n. Часто нужна для задач на последовательные числа.','n — количество слагаемых, S — сумма','1+2+…+100 = 100·101/2 = 5050.',1,[R`S=\frac{n^2}{2}`,R`S=\frac{n(n-1)}{2}`,R`S=n(n+1)`],'S=n*(n+1)/2'),

 F(2,'Процентное изменение','Percent change',R`p=\frac{n-o}{o}\cdot 100`,'Насколько процентов новое значение отличается от старого. Всегда делим на старое значение.','n — новое значение, o — старое, p — изменение в %','Цена выросла с 80 до 100: (100−80)/80·100 = 25%.',1,[R`p=\frac{n-o}{n}\cdot 100`,R`p=\frac{o-n}{o}\cdot 100`,R`p=\frac{n}{o}\cdot 100`],'p=(n-o)/o*100',{mist:'Делить на новое значение вместо старого.'}),
 F(2,'Последовательные процентные изменения','Successive percent changes',R`p=a+b+\frac{ab}{100}`,'Итоговое изменение после двух последовательных изменений на a% и b%. Для снижения подставляйте отрицательное значение.','a, b — изменения в % (со знаком)','Рост на 20%, затем падение на 10%: 20 − 10 − 2 = +8%.',2,[R`p=a+b`,R`p=a+b-\frac{ab}{100}`,R`p=\frac{a+b}{2}`],'p=a+b+a*b/100',{mist:'Складывать проценты напрямую: +20% и −20% не дают 0.'}),
 F(2,'Маржа','Profit margin',R`m=\frac{r-c}{r}\cdot 100`,'Маржа считается от выручки (цены продажи), а наценка — от себестоимости.','r — выручка, c — себестоимость, m — маржа в %','Цена 200, себестоимость 150: маржа 25%, наценка 33,3%.',2,[R`m=\frac{r-c}{c}\cdot 100`,R`m=\frac{r}{c}\cdot 100`,R`m=\frac{c}{r}\cdot 100`],'m=(r-c)/r*100'),

 F(3,'Свойство пропорции','Cross-multiplication',R`\frac{a}{b}=\frac{c}{d}\iff ad=bc`,'Крест-накрест: произведение крайних равно произведению средних.','a, b, c, d — ненулевые числа','3/4 = 6/8 → 3·8 = 4·6 = 24.',1,[R`\frac{a}{b}=\frac{c}{d}\iff ac=bd`,R`\frac{a}{b}=\frac{c}{d}\iff a+d=b+c`,R`\frac{a}{b}=\frac{c}{d}\iff ab=cd`],'a=b*c/d'),
 F(3,'Деление в заданном отношении','Splitting in a ratio',R`x=T\cdot\frac{a}{a+b}`,'Часть целого T при отношении частей a : b.','T — целое, a:b — отношение, x — часть, соответствующая a','Разделить 120 в отношении 2:3 → первая часть 120·2/5 = 48.',1,[R`x=T\cdot\frac{a}{b}`,R`x=\frac{T}{a+b}`,R`x=T\cdot\frac{a}{a-b}`],'x=T*a/(a+b)'),
 F(3,'Обратная пропорциональность','Inverse proportion',R`a\cdot b=c\cdot d`,'Если величины обратно пропорциональны, их произведение постоянно.','a, b — значения до изменения, c, d — после','6 рабочих — 10 дней; 15 рабочих — x дней: 6·10 = 15·x, x = 4.',2,[R`\frac{a}{b}=\frac{c}{d}`,R`a+b=c+d`,R`a-b=c-d`],'a=c*d/b'),

 F(4,'Произведение степеней','Product of powers',R`a^m\cdot a^n=a^{m+n}`,'При умножении степеней с одинаковым основанием показатели складываются.','a — основание, m, n — показатели','2³·2⁴ = 2⁷ = 128.',1,[R`a^m\cdot a^n=a^{mn}`,R`a^m\cdot a^n=(2a)^{m+n}`,R`a^m\cdot a^n=a^{m-n}`],'a^m*a^n=a^(m+n)'),
 F(4,'Степень степени','Power of a power',R`(a^m)^n=a^{mn}`,'При возведении степени в степень показатели перемножаются.','a — основание, m, n — показатели','(3²)³ = 3⁶ = 729.',1,[R`(a^m)^n=a^{m+n}`,R`(a^m)^n=a^{m^n}`,R`(a^m)^n=a^m\cdot a^n`],'(a^m)^n=a^(m*n)'),
 F(4,'Отрицательная степень','Negative exponent',R`a^{-n}=\frac{1}{a^n}`,'Отрицательный показатель — это обратная величина.','a ≠ 0, n — показатель','2⁻³ = 1/8.',1,[R`a^{-n}=-a^n`,R`a^{-n}=\frac{1}{a^{-n}}`,R`a^{-n}=\frac{1}{n^a}`],'a^(-n)=1/a^n'),
 F(4,'Корень из произведения','Root of a product',R`\sqrt{ab}=\sqrt{a}\cdot\sqrt{b}`,'Корень из произведения равен произведению корней (при a, b ≥ 0).','a, b ≥ 0','√72 = √36·√2 = 6√2.',2,[R`\sqrt{a+b}=\sqrt{a}+\sqrt{b}`,R`\sqrt{ab}=\sqrt{a}+\sqrt{b}`,R`\sqrt{ab}=\frac{\sqrt a}{\sqrt b}`],'sqrt(a*b)=sqrt(a)*sqrt(b)',{mist:'Корень из суммы не равен сумме корней.'}),

 F(5,'Квадрат суммы','Square of a sum',R`(a+b)^2=a^2+2ab+b^2`,'Одна из формул сокращённого умножения. Не забывайте удвоенное произведение.','a, b — любые числа','(x+3)² = x² + 6x + 9.',1,[R`(a+b)^2=a^2+b^2`,R`(a+b)^2=a^2+ab+b^2`,R`(a+b)^2=a^2-2ab+b^2`],'(a+b)^2=a^2+2*a*b+b^2',{mist:'Потерять удвоенное произведение 2ab.'}),
 F(5,'Разность квадратов','Difference of squares',R`a^2-b^2=(a-b)(a+b)`,'Раскладывает разность квадратов на множители. Любимый приём GMAT.','a, b — любые числа','49 − 25 = (7−5)(7+5) = 24.',1,[R`a^2-b^2=(a-b)^2`,R`a^2-b^2=(a+b)^2`,R`a^2+b^2=(a+b)(a-b)`],'a^2-b^2=(a-b)*(a+b)'),
 F(5,'Дискриминант','Discriminant',R`D=b^2-4ac`,'Определяет число корней квадратного уравнения ax²+bx+c=0: D>0 — два, D=0 — один, D<0 — нет.','a, b, c — коэффициенты','x²−5x+6=0: D=25−24=1 → два корня.',2,[R`D=b^2+4ac`,R`D=a^2-4bc`,R`D=b^2-2ac`],'D=b^2-4*a*c'),

 F(6,'Неравенство с модулем: |x| < a','Absolute value: less than',R`|x|<a\iff -a<x<a`,'Расстояние от нуля меньше a — значит x лежит между −a и a (при a > 0).','a > 0','|x| < 3 ⇒ −3 < x < 3.',2,[R`|x|<a\iff x<a`,R`|x|<a\iff x<-a\ \text{or}\ x>a`,R`|x|<a\iff 0<x<a`]),

 F(7,'Скорость, время, расстояние','Distance formula',R`d=r\cdot t`,'Основа всех задач на движение. Следите за единицами измерения.','d — расстояние, r — скорость, t — время','60 км/ч · 2,5 ч = 150 км.',1,[R`r=d\cdot t`,R`t=d\cdot r`,R`d=\frac{r}{t}`],'d=r*t'),

 F(9,'n-й член арифметической прогрессии','Arithmetic sequence: nth term',R`a_n=a_1+(n-1)d`,'Каждый следующий член больше предыдущего на разность d.','a₁ — первый член, d — разность, n — номер','a₁=3, d=4: a₁₀ = 3 + 9·4 = 39.',1,[R`a_n=a_1+nd`,R`a_n=a_1\cdot d^{n-1}`,R`a_n=a_1+(n+1)d`],'a_n=a_1+(n-1)*d'),

 F(13,'Два множества','Two sets',R`|A\cup B|=|A|+|B|-|A\cap B|`,'Число элементов в объединении двух множеств.','|A| — число элементов в A','В классе 20 любят математику, 15 — физику, 8 — обе: 20+15−8 = 27.',1,[R`|A\cup B|=|A|+|B|`,R`|A\cup B|=|A|+|B|+|A\cap B|`,R`|A\cup B|=|A|\cdot|B|`]),

 F(14,'Количество делителей','Number of divisors',R`d=(a+1)(b+1)`,'Если n = pᵃ·qᵇ (p, q — простые), то число делителей равно (a+1)(b+1).','a, b — показатели в разложении на простые','12 = 2²·3¹ → (2+1)(1+1) = 6 делителей.',2,[R`d=ab`,R`d=(a-1)(b-1)`,R`d=a+b+1`],'d=(a+1)*(b+1)'),

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function T(s, disp){ try{ return `<span class="tex" role="math" aria-label="${esc(s)}">${katex.renderToString(s,{displayMode:!!disp,throwOnError:false,strict:false})}</span>` }catch(e){ return `<code>${esc(s)}</code>` } }
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a };
const pick = a => a[Math.floor(Math.random()*a.length)];
const dayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = (n,d=new Date()) => { const x=new Date(d); x.setDate(x.getDate()+n); return x };
const dayDiff = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const m=n%10; return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c };

/* ============================ ПРОВЕРКА ВВОДА ФОРМУЛЫ ============================ */
function tokenize(src){
 const s=String(src).replace(/[−–]/g,'-').replace(/[×·⋅]/g,'*').replace(/÷/g,'/').replace(/π/g,'pi').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\\cdot/g,'*').replace(/\s+/g,'')
  .replace(/([a-zA-Z])_\{([a-zA-Z0-9]+)\}/g,'$1_$2').replace(/[{\[]/g,'(').replace(/[}\]]/g,')');
 const t=[];let i=0;
 while(i<s.length){
  const r=s.slice(i);let m;
  if((m=r.match(/^\d+([.,]\d+)?/))){t.push({k:'n',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length}
  else if((m=r.match(/^[a-zA-Z]_[a-zA-Z0-9]+/))){t.push({k:'v',v:m[0]});i+=m[0].length}
  else if((m=r.match(/^(sqrt|abs)/))){t.push({k:'f',v:m[0]});i+=m[0].length}
  else if(r.startsWith('pi')){t.push({k:'n',v:Math.PI});i+=2}
  else if(/^[a-zA-Z]/.test(r)){t.push({k:'v',v:r[0]});i++}
  else if(/^[-+*\/^()=!]/.test(r)){t.push({k:'o',v:r[0]});i++}
  else throw new Error('Недопустимый символ «'+r[0]+'»');
 }
 return t;
}
const fact = x => { const r=Math.round(x); if(Math.abs(x-r)>1e-9||r<0||r>20) return NaN; let f=1; for(let i=2;i<=r;i++) f*=i; return f };
function parseSide(tokens, vars){
 let p=0;
 const peek=()=>tokens[p], isOp=v=>peek()&&peek().k==='o'&&peek().v===v;
 const atomStart=()=>{const t=peek();return t&&(t.k==='n'||t.k==='v'||t.k==='f'||(t.k==='o'&&t.v==='('))};
 function expr(){let l=term();while(isOp('+')||isOp('-')){const o=tokens[p++].v,a=l,b=term();l=o==='+'?e=>a(e)+b(e):e=>a(e)-b(e)}return l}
 function term(){let l=unary();for(;;){
  if(isOp('*')||isOp('/')){const o=tokens[p++].v,a=l,b=unary();l=o==='*'?e=>a(e)*b(e):e=>a(e)/b(e)}
  else if(atomStart()){const a=l,b=unary();l=e=>a(e)*b(e)} else return l}}
 function unary(){ if(isOp('-')){p++;const a=unary();return e=>-a(e)} if(isOp('+')){p++;return unary()} return power() }
 function power(){const b=post();if(isOp('^')){p++;const x=unary();return e=>Math.pow(b(e),x(e))}return b}
 function post(){let a=atom();while(isOp('!')){p++;const x=a;a=e=>fact(x(e))}return a}
 function atom(){const t=tokens[p++];if(!t)throw new Error('Выражение оборвано');
  if(t.k==='n')return()=>t.v;
  if(t.k==='v'){vars.add(t.v);return e=>e[t.v]}
  if(t.k==='f'){let x;if(isOp('(')){p++;x=expr();if(!isOp(')'))throw new Error('Не закрыта скобка');p++}else x=post();return t.v==='sqrt'?e=>Math.sqrt(x(e)):e=>Math.abs(x(e))}
  if(t.k==='o'&&t.v==='('){const x=expr();if(!isOp(')'))throw new Error('Не закрыта скобка');p++;return x}
  throw new Error('Неожиданный символ «'+t.v+'»')}
 if(!tokens.length)throw new Error('Пустая часть равенства');
 const f=expr(); if(p<tokens.length)throw new Error('Лишние символы в выражении'); return f;
}
function parseEq(str){
 const tk=tokenize(str); const idx=[]; tk.forEach((t,i)=>{if(t.k==='o'&&t.v==='=')idx.push(i)});
 if(idx.length!==1) throw new Error('Нужно ровно одно равенство (знак =)');
 const vars=new Set(), ls=tk.slice(0,idx[0]), rs=tk.slice(idx[0]+1);
 return {L:parseSide(ls,vars),R:parseSide(rs,vars),vars,ls:ls.map(t=>t.v).join(''),rs:rs.map(t=>t.v).join('')};
}
function checkType(f, input){
 let U; try{ U=parseEq(input) }catch(e){ return {err:e.message} }
 const A=parseEq(f.ans), av=[...A.vars];
 if(av.length!==U.vars.size||av.some(v=>!U.vars.has(v))) return {ok:false,note:'Набор переменных не совпадает (регистр важен).'};
 const lhs=f.ans.split('=')[0].trim(), lv=/^[a-zA-Z](_[a-zA-Z0-9]+)?$/.test(lhs)?lhs:null;
 if(!lv && U.ls===U.rs) return {ok:false};
 const rnd=()=>f.int?2+Math.floor(Math.random()*8):Math.round((1.2+Math.random()*5.5)*100)/100;
 let good=0;
 for(let k=0;k<80&&good<5;k++){
  const env={}; av.forEach(v=>env[v]=rnd()); if(lv) env[lv]=A.R(env);
  const a=U.L(env), b=U.R(env); if(!isFinite(a)||!isFinite(b)||!isFinite(env[av[0]])) continue;
  good++; if(Math.abs(a-b)>1e-6*Math.max(1,Math.abs(a),Math.abs(b))) return {ok:false};
 }
 if(good<3) return {ok:false};
 if(lv){ let diff=false; for(let k=0;k<20&&!diff;k++){const env={};av.forEach(v=>env[v]=rnd());const a=U.L(env),b=U.R(env);if(isFinite(a)&&isFinite(b)&&Math.abs(a-b)>1e-6)diff=true} if(!diff) return {ok:false,note:'Равенство тривиально.'} }
 return {ok:true};
}

/* ============================ SM-2, XP, УРОВНИ ============================ */
function sm2(p, q, ok){
 if(q<3){ p.rep=0; p.int=1; p.lapses++; p.due=Date.now()+10*60000 }
 else { p.rep++; p.int = p.rep===1?1 : p.rep===2?6 : Math.round(p.int*p.ef); p.due=Date.now()+p.int*864e5 }
 p.ef=Math.max(1.3, p.ef+0.1-(5-q)*(0.08+(5-q)*0.02));

}
const lvlOf = xp => Math.min(50, 1+Math.floor(Math.pow(xp/40,1/1.6)));
const lvlAt = L => Math.round(40*Math.pow(L-1,1.6));
const LVL_NAMES=['Новичок','Ученик','Практик','Счётчик','Аналитик','Стратег','Эксперт','Мастер','Гроссмейстер','Quant Master'];
const lvlName = L => LVL_NAMES[Math.min(9,Math.floor((L-1)/5))];
function addXP(n, why){

 const after=lvlOf(S.xp); if(after>before) toast(`🎉 Новый уровень ${after}: ${lvlName(after)}!`);
}
const today = () => S.days[dayKey()] || {n:0,ok:0,ms:0};
const dueCount = () => active().filter(f=>{const p=S.prog[f.id];return p&&p.seen&&p.due<=Date.now()}).length;

function fixStreak(){

 if(S.freezeWeek!==wk){S.freezeWeek=wk;S.freezes=1}
 if(S.goalDay&&S.goalDay!==t&&S.goalDay!==y){ if(dayDiff(S.goalDay,t)===2&&S.freezes>0){S.freezes--;S.goalDay=y;setTimeout(()=>toast('❄️ Заморозка спасла ваш streak!'),600)} else S.streak=0 }

}

/* ============================ ЗАПИСЬ ОТВЕТА ============================ */
function record(f, ok, q, ms, kind, hint){
 const sess=SESS, p=P(f.id); let xp=0, learned=false;
 const first = p.seen===0;
 if(first){ p.seen=1; S.newDays[dayKey()]=newToday()+1 }
 learned = ok && q>=3 && p.rep===0;
 sm2(p,q,ok); p.last=ok; ok?p.ok++:p.bad++;
 const base = kind==='card' ? ({1:0,3:4,4:8,5:10}[q]||0) : ok ? (kind==='type'?20-(hint?5:0):10) : 0;
 const speed = ok&&kind!=='card'&&ms<5000?5:0;
 if(ok&&q>=3){ sess.combo++; sess.bestCombo=Math.max(sess.bestCombo,sess.combo) } else sess.combo=0;
 const mult = sess.combo>=10?2:sess.combo>=5?1.5:1;
 xp = Math.round((base+speed)*mult) + (learned?15:0);
 xp = Math.max(0, Math.min(xp, 400-sess.xp)); // антифрод: лимит XP за сессию
 sess.xp+=xp; sess.n++; if(ok)sess.ok++; if(!ok&&!sess.wrong.includes(f.id))sess.wrong.push(f.id);
 sess.fast = ok&&ms<5000 ? sess.fast+1 : 0; sess.fastBest=Math.max(sess.fastBest||0,sess.fast);
 sess.log.push({id:f.id,ok});
 addXP(xp,kind);
 S.answers.push({id:f.id,t:f.t,ok,ms:Math.min(ms,120000),ts:Date.now(),k:kind,h:hint?1:0}); if(S.answers.length>4000)S.answers.splice(0,500);
 S.totalAnswers++; if(!S.topicsSeen.includes(f.t))S.topicsSeen.push(f.t);
 if(kind==='type'&&ok)S.stats.typeOk++;
 const d=S.days[dayKey()]||(S.days[dayKey()]={n:0,ok:0,ms:0}); d.n++; if(ok)d.ok++; d.ms+=Math.min(ms,120000);
 // дневная цель и streak
 if(d.n>=S.goal && S.goalDay!==dayKey()){
  S.streak=(S.goalDay===dayKey(addDays(-1))?S.streak:0)+1; S.best=Math.max(S.best,S.streak); S.goalDay=dayKey();
  addXP(50,'goal'); sess.xp+=50; toast(`🎯 Дневная цель выполнена! +50 XP · streak ${S.streak}`);
 }
 checkAch(sess);
 return {xp,learned};
}

let SESS=null, UI={}, cfg={mode:'cards',topics:[],diff:0,count:10,dur:5}, timers=[];
const MODES={

 errors:{em:'🛠️',n:'Работа над ошибками',d:'Формулы, где вы ошибались'}
};
function buildQueue(c){
 let pool=active().filter(f=>(!c.topics.length||c.topics.includes(f.t))&&(!c.diff||f.diff===c.diff));
 const now=Date.now(); let items=[];
 const mk=(f,kind)=>({id:f.id,kind});
 const mcKind=()=>Math.random()<.5?'mc':'mcr';
 if(c.mode==='cards'){
  const sorted=shuffle(pool).sort((a,b)=>{const pa=S.prog[a.id],pb=S.prog[b.id];const da=pa&&pa.seen&&pa.due<=now?0:pa&&pa.seen?2:1;const db=pb&&pb.seen&&pb.due<=now?0:pb&&pb.seen?2:1;return da-db});
  items=sorted.slice(0,c.count).map(f=>mk(f,'card'));
 } else if(c.mode==='test') items=shuffle(pool).slice(0,c.count).map(f=>mk(f,mcKind()));
 else if(c.mode==='type') items=shuffle(pool.filter(hasAns)).slice(0,c.count).map(f=>mk(f,'type'));
 else if(c.mode==='timed'){
  items=pool.map(f=>({f,k:f.diff+Math.random()*1.4})).sort((a,b)=>a.k-b.k).map(o=>mk(o.f,hasAns(o.f)&&Math.random()<.4?'type':mcKind()));
 } else if(c.mode==='smart'){
  const due=pool.filter(f=>{const p=S.prog[f.id];return p&&p.seen&&p.due<=now}).sort((a,b)=>S.prog[a.id].due-S.prog[b.id].due);
  const fresh=shuffle(pool.filter(f=>!(S.prog[f.id]&&S.prog[f.id].seen))).slice(0,Math.max(0,S.newLimit-newToday()));
  items=due.concat(fresh).slice(0,Math.max(c.count,20)).map(f=>mk(f,'card'));
 } else if(c.mode==='errors'){
  const bad=pool.filter(f=>{const p=S.prog[f.id];return p&&(p.last===false||p.lapses>0)&&p.seen});
  items=shuffle(bad).slice(0,c.count).map(f=>mk(f,hasAns(f)&&Math.random()<.4?'type':pick(['mc','mcr','card'])));
 }
 return items;
}

}

 }

function vTrain(){
 if(!SESS){ if(S.sess){ SESS=S.sess } else return `<div class="card c"><h2>Нет активной сессии</h2><a class="btn pri" href="#/setup">Настроить тренировку</a></div>` }
 const it=cur(); if(!it){ finishSession(); return '' } if(!UI.t0) resetUI();
 const f=getF(it.id); if(!f){ SESS.i++; resetUI(); return vTrain() }
 const total=SESS.items.length, timed=SESS.mode==='timed', t=topicOf(f.t), res=UI.res;
 let top=`<div class="tr-top"><button class="btn sm ghost" data-act="exit" aria-label="Выйти с сохранением">✕ Выйти</button>
  <div class="bar-bg"><i style="width:${timed?pct(SESS.left,SESS.cfg.dur*60):pct(SESS.i,total)}%"></i></div>
  <span class="chip timer">${timed?`⏱ <span id="tleft">${fmt(SESS.left)}</span>`:`${SESS.i+1}/${total}`}</span>
  ${SESS.combo>=3?`<span class="chip">🔥 ×${SESS.combo>=10?2:SESS.combo>=5?1.5:1} · ${SESS.combo}</span>`:''}</div>${timed?`<div class="qt"><i id="qt" style="width:${Math.max(0,UI.qLeft/S.qTime*100)}%"></i></div>`:''}`;
 let body='';
 if(it.kind==='card'){
  body = UI.flip
  ? `<div class="card q flip" id="fc"><span class="tag acc" style="align-self:center">${esc(t.ru)}</span><div class="bigtex" style="margin:14px 0;overflow-x:auto">${T(f.tex,true)}</div><p class="vars" style="margin:0 0 6px">${esc(f.w||'')}</p><p class="sm" style="margin:0"><b>Пример:</b> ${esc(f.ex||'')}</p></div>
     <div class="rates"><button class="r1" data-act="rate" data-q="1">1 · Не знал</button><button class="r2" data-act="rate" data-q="3">2 · Трудно</button><button class="r3" data-act="rate" data-q="4">3 · Знал</button><button class="r4" data-act="rate" data-q="5">4 · Легко</button></div>
     <p class="mut sm c" style="margin-top:8px">Клавиши 1–4 · на телефоне: свайп ← «не знал», → «знал»</p>`
  : `<div class="card q flip" id="fc" role="button" tabindex="0" aria-label="Перевернуть карточку"><span class="tag acc" style="align-self:center">${esc(t.ru)}</span><h2 style="margin-top:14px">${esc(f.ru)}</h2><p class="mut">${esc(f.en)}</p><p>${esc(f.desc)}</p><p class="mut sm" style="margin:12px 0 0">Вспомните формулу, затем нажмите — или пробел</p></div>`;
 } else if(it.kind==='mc'||it.kind==='mcr'){
  const q=it.kind==='mc'?`<span class="tag acc">${esc(t.ru)}</span><h2 style="margin-top:10px">${esc(f.ru)}</h2><p class="mut" style="margin:0">Какая формула соответствует этому правилу?</p>`
   :`<span class="tag acc">${esc(t.ru)}</span><p class="mut" style="margin:10px 0 0">Как называется эта формула?</p><div class="bigtex c" style="padding:10px 0;overflow-x:auto">${T(f.tex,true)}</div>`;
  body=`<div class="card q">${q}<div class="opts">${it.o.map((o,i)=>`<button class="opt ${res?(o.ok?'ok':res.pick===i?'bad':''):''}" data-act="opt" data-i="${i}" ${res?'disabled':''}><kbd>${i+1}</kbd><span>${it.kind==='mc'?T(o.x):esc(o.x)}</span></button>`).join('')}</div>${feedback(f,res)}</div>`;
 } else {
  body=`<div class="card q"><span class="tag acc">${esc(t.ru)}</span><h2 style="margin-top:10px">${esc(f.ru)}</h2><p class="mut">${esc(f.en)} — запишите формулу равенством.</p>
  <input type="text" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="например: a^2 + b^2 = c^2" value="${esc(UI.val||'')}" ${res?'disabled':''} aria-label="Ваш ответ">
  <p class="mut sm" style="margin:6px 0">Синтаксис: <code>^</code> степень, <code>*</code> или пробел — умножение, <code>sqrt(x)</code>, <code>pi</code>, <code>n!</code>, индексы <code>a_1</code>, <code>x_max</code>. Допустимы любые равносильные записи.</p>
  ${UI.err?`<p class="notice">${esc(UI.err)}</p>`:''}${UI.hint&&!res?`<p class="notice">💡 Переменные: ${[...parseEq(f.ans).vars].map(esc).join(', ')} · ${esc(f.w||'')}</p>`:''}
  ${res?'':`<div class="row" style="margin-top:8px"><button class="btn pri" data-act="submit">Проверить ↵</button><button class="btn" data-act="hint" ${UI.hint?'disabled':''}>💡 Подсказка (−5 XP)</button><button class="btn ghost" data-act="giveup">Не знаю</button></div>`}${feedback(f,res)}</div>`;
 }
 return `<div class="train">${top}${body}</div>`;
}
function feedback(f,res){
 if(!res)return '';
 const head=res.timeout?'⏰ Время вышло':res.ok?'✅ Верно!':res.gave?'Правильный ответ':'❌ Неверно';
 return `<div class="fb ${res.ok?'ok':'bad'}"><div class="row between"><b>${head}</b><span>${res.xp?`+${res.xp} XP${res.learned?' · новая формула!':''}`:''}</span></div>
 ${res.ok?'':`<div class="in bigtex" style="margin:8px 0;overflow-x:auto">${T(f.tex,true)}</div>`}<div class="in sm">${esc(f.desc)}</div>${f.mist&&!res.ok?`<div class="in sm" style="margin-top:6px">⚠️ ${esc(f.mist)}</div>`:''}
 ${SESS&&SESS.mode==='timed'?'':`<button class="btn pri" style="margin-top:12px" data-act="next">Далее ↵</button>`}</div>`;
}

function vStats(){
 const range=UI.range||7, now=new Date(); const ans=S.answers;
 const topics=visTopics().map(t=>{const a=topicAcc(t.id),p=topicProgress(t.id);const cov=p.n?p.s/p.n:0;const ready=a.n?Math.round((a.ok/a.n*.6+p.m/Math.max(1,p.n)*.4)*100*(0.5+cov/2)):0;return {t,a,p,ready}});
 const days=[...Array(range)].map((_,i)=>{const k=dayKey(addDays(i-range+1));const d=S.days[k];return {k,n:d?d.n:0,acc:d&&d.n?d.ok/d.n:null}});

const BOTS=['Алия','Данияр','Мадина','Тимур','Аружан','Ерлан','Софья','Артём','Камила','Нурлан','Айдана','Максим','Дана','Руслан','Милана','Ильяс','Ксения','Бекзат','Лейла','Олег','Зарина','Павел','Асель','Игорь','Сабина','Денис','Томирис','Антон','Жанар','Виктор','Аян','Лиза','Марат','Салтанат','Георгий','Диляра','Кирилл','Назгуль','Андрей','Инна','Арман','Полина','Султан','Вера','Тамерлан','Яна','Аскар','Мария','Дамир','Ева'];
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296 } }
function weekStart(){ const d=new Date(); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-((d.getUTCDay()+6)%7)) }
function board(kind){
 const r=rng(kind==='week'?Math.floor(weekStart()/864e5):7), av=AVATARS;
 const rows=BOTS.map((n,i)=>({name:n,av:av[i%av.length],xp:kind==='week'?Math.floor(60+r()*r()*1500):Math.floor(500+r()*r()*24000),me:false}));
 const mine=kind==='week'?S.xpLog.filter(x=>x.ts>=weekStart()).reduce((s,x)=>s+x.amt,0):S.xp;
 if(!S.hideLb) rows.push({name:S.nick,av:S.avatar,xp:mine,me:true});
 return rows.sort((a,b)=>b.xp-a.xp);
}
function boardRank(kind){ const i=board(kind).findIndex(r=>r.me); return i<0?0:i+1 }
function vBoard(){

  case 'setup': html=vSetup(); break; case 'train': html=vTrain(); break; case 'result': html=vResult(); break;
  case 'stats': html=vStats(); break; case 'board': html=vBoard(); break; case 'ach': html=vAch(); break; case 'me': html=vMe(); break; case 'admin': html=vAdmin(); break;
  default: html=vNotFound();
 }
 $('#app').innerHTML=html; renderChrome(route);
 if(a==='train'&&SESS){ startTimers(); const ti=$('#typein'); if(ti&&!UI.res)ti.focus() }
 if(a==='topics')bindSearch(); if(a==='admin')bindAdminPrev();
 if(a==='train'&&SESS)bindSwipe();

 const g=id=>$(id).value.trim(), f={id:'c'+Date.now(),custom:true,t:+g('#a_t'),ru:g('#a_ru'),en:g('#a_en'),tex:g('#a_tex'),desc:g('#a_desc'),w:g('#a_w'),ex:g('#a_ex'),diff:+g('#a_diff'),d:g('#a_d').split('\n').map(s=>s.trim()).filter(Boolean),ans:g('#a_ans')||null};
 if(!f.ru||!f.tex||!f.desc) return toast('Заполните название, формулу и описание');
 if(f.d.length<3) return toast('Нужно минимум 3 дистрактора');
 if(f.ans){ try{ parseEq(f.ans) }catch(e){ return toast('Ответ для ввода: '+e.message) } }
 S.custom.push(f); save(); toast('Формула добавлена'); render();
}
document.addEventListener('keydown',e=>{
 if(location.hash!=='#/train'||!SESS)return; const it=cur(); if(!it)return;
 const typing=e.target.id==='typein';
 if(e.target.matches('input,textarea')&&!typing)return;
 if(typing){ if(e.key==='Enter'){e.preventDefault();submitType(false)} return }
 if(it.kind==='card'){
  if((e.key===' '||e.key==='Enter')&&!UI.flip){e.preventDefault();UI.flip=true;render()}
  else if(UI.flip&&'1234'.includes(e.key)&&e.key){ rateCard([0,1,3,4,5][+e.key]) }
 } else if(it.kind==='mc'||it.kind==='mcr'){
  if(UI.res){ if(e.key==='Enter'||e.key===' '){e.preventDefault();if(SESS.mode!=='timed')nextQ()} }
  else if('1234'.includes(e.key)&&e.key) pickOpt(+e.key-1);
 } else if(UI.res&&(e.key==='Enter')&&SESS.mode!=='timed') nextQ();
});
/* карточка по Enter/пробелу при фокусе */
function boot(){ applyTheme(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!S.theme){applyTheme();render()}}); if(S.sess&&S.sess.items&&location.hash==='#/train'){SESS=S.sess} render() }
/* режим «потренировать эту формулу» */
const _bq=buildQueue; buildQueue=function(c){ if(c.only){ const f=getF(c.only); return f?[{id:f.id,kind:'card'}]:[] } return _bq(c) };
boot();
</script>
